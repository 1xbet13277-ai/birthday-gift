let data=JSON.parse(localStorage.getItem("gift_admin_data")||"null")||structuredClone(DEFAULT);
const $=id=>document.getElementById(id);
function go(){if($("ap").value!==ADMIN){$("ls").textContent="الباسورد غلط";$("ls").className="status err";return}$("login").classList.add("hidden");$("dash").classList.remove("hidden");render()}
$("ap").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("p-"+b.dataset.p).classList.add("active")});
function v(id,x){if($(id))$(id).value=x??""}function esc(x){return String(x??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function render(){["pageTitle","password","passwordHint","lockTitle","lockText","lockButton","introTitle","introSubtitle","heroBadge","heroTitle","heroText","heroButton","heroNote","storyTitle","storySubtitle","reasonsTitle","reasonsSubtitle","galleryTitle","gallerySubtitle","surprisesTitle","surprisesSubtitle","counterTitle","counterSubtitle","counterFooter","letterTitle","letterSubtitle","letterLabel","letterBody","letterSignature","finalHeading","finalText","finalBirthday","sky","pink"].forEach(k=>v(k,data[k]));v("counterStart",(data.counterStart||"").slice(0,16));
$("storyItems").innerHTML=data.story.map((x,i)=>`<div class="sub"><h3>المحطة ${i+1}</h3><div class="row"><div class="field"><label>العنوان</label><input id="st${i}t" class="input" value="${esc(x.title)}"></div><div class="field"><label>التاريخ</label><input id="st${i}d" class="input" value="${esc(x.date)}"></div></div><div class="field"><label>الوصف</label><textarea id="st${i}x" class="input">${x.text}</textarea></div></div>`).join("");
$("reasonItems").innerHTML=data.reasons.map((x,i)=>`<div class="field"><label>السبب ${i+1}</label><textarea id="rs${i}" class="input" style="min-height:78px">${x}</textarea></div>`).join("");
$("gallerySlots").innerHTML=data.gallery.map((x,i)=>`<div class="slot"><div class="preview" id="prev${i}">${x.src?`<img src="${x.src}">`:"صورة "+(i+1)}</div><div><div class="field"><label>اختيار صورة</label><input id="img${i}" class="input" type="file" accept="image/*"></div><div class="field"><label>الكلام تحت الصورة</label><input id="cap${i}" class="input" value="${esc(x.caption)}"></div><button class="btn alt" onclick="addImg(${i})">إضافة الصورة</button></div></div>`).join("");
$("surpriseItems").innerHTML=data.surprises.map((x,i)=>`<div class="sub"><h3>المفاجأة ${i+1}</h3><div class="row"><div class="field"><label>العنوان</label><input id="su${i}t" class="input" value="${esc(x.title)}"></div><div class="field"><label>نص الزر</label><input id="su${i}b" class="input" value="${esc(x.button)}"></div></div><div class="field"><label>الوصف</label><input id="su${i}d" class="input" value="${esc(x.description)}"></div><div class="field"><label>عنوان الرسالة</label><input id="su${i}mt" class="input" value="${esc(x.modalTitle)}"></div><div class="field"><label>نص الرسالة</label><textarea id="su${i}mx" class="input">${x.modalText}</textarea></div></div>`).join("");
}
async function addImg(i){const f=$("img"+i).files[0];if(!f)return;const bmp=await createImageBitmap(f);const max=900;let w=bmp.width,h=bmp.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);data.gallery[i].src=c.toDataURL("image/jpeg",.7);localStorage.setItem("gift_admin_data",JSON.stringify(data));render()}
function collect(){["pageTitle","password","passwordHint","lockTitle","lockText","lockButton","introTitle","introSubtitle","heroBadge","heroTitle","heroText","heroButton","heroNote","storyTitle","storySubtitle","reasonsTitle","reasonsSubtitle","galleryTitle","gallerySubtitle","surprisesTitle","surprisesSubtitle","counterTitle","counterSubtitle","counterFooter","letterTitle","letterSubtitle","letterLabel","letterBody","letterSignature","finalHeading","finalText","finalBirthday","sky","pink"].forEach(k=>data[k]=$(k).value);data.counterStart=$("counterStart").value?$("counterStart").value+":00":"2024-01-01T00:00:00";data.story=data.story.map((x,i)=>({title:$("st"+i+"t").value,date:$("st"+i+"d").value,text:$("st"+i+"x").value}));data.reasons=data.reasons.map((x,i)=>$("rs"+i).value);data.gallery=data.gallery.map((x,i)=>({src:x.src,caption:$("cap"+i).value}));data.surprises=data.surprises.map((x,i)=>({...x,title:$("su"+i+"t").value,description:$("su"+i+"d").value,button:$("su"+i+"b").value,modalTitle:$("su"+i+"mt").value,modalText:$("su"+i+"mx").value}));localStorage.setItem("gift_admin_data",JSON.stringify(data))}
function downloadSite(){collect();const tpl=decodeURIComponent(escape(atob(TEMPLATE_B64)));const safe=JSON.stringify(data).replace(/<\//g,"<\\/");const html=tpl.replace("__SITE_DATA__",safe);const blob=new Blob([html],{type:"text/html;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="index.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$("saveStatus").textContent="تم تحميل index.html ✅ ارفعه مكان الملف القديم فقط.";$("saveStatus").className="status ok"}
function resetData(){if(confirm("ترجع للنسخة الأصلية؟")){data=structuredClone(DEFAULT);localStorage.setItem("gift_admin_data",JSON.stringify(data));render()}}
</script></body></html>
