<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eff9ff">
<title>For My Love</title>
<style>
:root{--sky:#78c8ff;--pink:#ff92b9;--ink:#29445c;--muted:#72879a;--shadow:0 18px 45px rgba(63,128,178,.14)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 9%,rgba(255,146,185,.25),transparent 22%),radial-gradient(circle at 88% 16%,rgba(120,200,255,.31),transparent 27%),linear-gradient(180deg,#fbfeff,#eef8ff 58%,#fff8fb);overflow-x:hidden}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.app{max-width:520px;margin:auto;overflow:hidden}
svg{display:block}.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hero{min-height:100svh;padding:18px;display:flex;align-items:flex-end}.glass{width:100%;padding:26px 22px;border-radius:34px;background:rgba(255,255,255,.72);border:1px solid #fff;backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.badge{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid #fff;color:#64819a;font-size:12px;font-weight:700}
h1{margin:18px 0 12px;font-size:43px;line-height:1.06;color:#4b7da8;font-family:"Segoe Script","Brush Script MT",cursive;font-weight:500}
.hero p{color:#61788d;line-height:1.9;font-size:16px}.cta{width:100%;margin-top:18px;border:0;border-radius:18px;padding:16px;color:#fff;font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--sky),var(--pink))}
.note{text-align:center;color:#8297aa;font-size:12px;margin-top:12px}
section{padding:30px 18px}.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(100,175,230,.28),transparent);margin:0 18px}
.head{text-align:center;margin-bottom:20px}.head h2{font-size:30px;margin:0 0 6px;color:#4d7da7;font-family:"Segoe Script","Brush Script MT",cursive;font-weight:500}.head p{margin:0;color:var(--muted);font-size:13px}
.timeline{position:relative}.timeline:before{content:"";position:absolute;right:20px;top:10px;bottom:8px;width:2px;background:linear-gradient(var(--sky),var(--pink))}
.event{position:relative;padding:0 58px 24px 0}.dot{position:absolute;right:2px;top:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid #fff;box-shadow:0 8px 20px rgba(63,128,178,.13);color:#5c91bb}
.event-card,.card{background:rgba(255,255,255,.72);border:1px solid #fff;border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.event h3{margin:0 0 5px;font-size:16px}.date{font-size:12px;color:#e17ba2;margin-bottom:6px}.event p,.card p{margin:0;color:var(--muted);line-height:1.7;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reason{min-height:140px;display:flex;flex-direction:column;justify-content:space-between}.reason .ri{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#e9f8ff,#fff0f6);color:#5e96bf}.reason b{font-size:15px;line-height:1.5}
.gallery{display:grid;grid-template-columns:1.08fr .92fr;gap:12px}.polaroid{background:#fff;padding:8px;border-radius:20px;box-shadow:var(--shadow)}.photo{min-height:200px;border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#dff4ff,#fff1f6);background-position:center;background-size:cover;display:grid;place-items:center;color:#7da2bd}.big .photo{min-height:420px}.cap{text-align:center;padding:9px 5px 3px;color:#6d8498;font-size:12px}
.surprise{min-height:175px;display:flex;flex-direction:column;justify-content:space-between}.sicon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#e8f7ff,#fff0f5);color:#5a91bb}.surprise h3{font-size:15px;margin:10px 0 5px}.sbtn{border:0;border-radius:14px;padding:11px;background:linear-gradient(135deg,#d9f1ff,#ffdce8);color:#4d7597;font-weight:800}
.counter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.c{text-align:center;padding:14px 3px;border-radius:18px;background:#fff;border:1px solid #fff}.c strong{display:block;font-size:23px;color:#4c7da8}.c small{font-size:10px;color:var(--muted)}
.letter{white-space:pre-line;line-height:2!important}.sign{margin-top:14px;color:#de789f;font-family:"Segoe Script","Brush Script MT",cursive;font-size:18px}
.final{min-height:75svh;display:flex;align-items:center;text-align:center}.final .card{width:100%}.finalHeart{font-size:52px}
.modal{display:none;position:fixed;inset:0;z-index:500;background:rgba(35,62,84,.24);backdrop-filter:blur(10px);align-items:flex-end;justify-content:center;padding:14px}.modal.show{display:flex}.sheet{width:min(100%,500px);background:#fff;border-radius:28px;padding:22px;box-shadow:0 25px 60px rgba(39,92,133,.22)}.sheet h3{color:#4c7da8;margin:0 0 8px}.sheet p{color:var(--muted);line-height:1.8}.close{width:100%;border:0;border-radius:14px;padding:12px;background:linear-gradient(135deg,var(--sky),var(--pink));color:#fff;font-weight:800}
#lock,#intro{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 15% 15%,rgba(255,146,185,.28),transparent 24%),radial-gradient(circle at 85% 18%,rgba(120,200,255,.34),transparent 28%),linear-gradient(180deg,#fbfeff,#eef8ff 60%,#fff8fb)}
#intro{z-index:9999;overflow:hidden}.introbox,.lockbox{width:min(100%,420px);text-align:center;padding:28px 22px;border-radius:32px;background:rgba(255,255,255,.76);border:1px solid #fff;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.introbox h2,.lockbox h2{font-family:"Segoe Script","Brush Script MT",cursive;color:#4d7da7;font-size:31px;margin:8px 0}.introbox p,.lockbox p{color:var(--muted);line-height:1.8}
.heartMain{font-size:58px}.float{position:absolute;bottom:-35px;color:#ef86ad;animation:rise linear forwards}.float.blue{color:#8ecfff}@keyframes rise{to{transform:translateY(-115vh) rotate(22deg);opacity:0}}.fade{animation:fade .7s forwards}@keyframes fade{to{opacity:0;visibility:hidden}}
.lockinput{width:100%;padding:15px;text-align:center;border:1px solid rgba(110,180,230,.35);border-radius:15px;background:#fff;font-size:18px;outline:none}.lockbtn{width:100%;margin-top:10px;padding:14px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--sky),var(--pink));color:#fff;font-weight:800}.hint{font-size:13px;color:#d96f9a;font-weight:800;margin-top:10px}.err{min-height:20px;font-size:13px;color:#d45e82;margin-top:8px}
@media(max-width:370px){.grid2,.gallery{grid-template-columns:1fr}.big .photo{min-height:280px}h1{font-size:38px}}
</style>
</head>
<body>
<script>const SITE_DATA={"pageTitle": "For My Love", "password": "20/9/2003", "passwordHint": "الباسورد: 20/9/2003 🎂", "introTitle": "For My Love", "introSubtitle": "A little surprise is waiting for you", "lockTitle": "Just For You", "lockText": "الموقع ده معمول لشخص واحد بس… اكتبي تاريخ ميلادك علشان تبدأ المفاجأة.", "lockButton": "فتح الهدية", "heroBadge": "Birthday surprise", "heroTitle": "Happy Birthday\nMy Love ♡", "heroText": "في يومك الحلو، حبيت أسيب لكِ مكان صغير على الإنترنت… مليان ذكريات، رسائل، ومفاجآت كلها ليكِ أنتِ.", "heroButton": "ابدئي المفاجأة", "heroNote": "مصنوع بحب… ليكِ وحدك 🩷", "storyTitle": "Our Story", "storySubtitle": "كل لحظة صغيرة… عملت حكاية كبيرة", "story": [{"title": "أول مرة اتكلمنا", "date": "ضع التاريخ هنا", "text": "كلام بسيط جدًا… لكنه كان بداية حاجة ما كنتش أعرف قد إيه هتبقى غالية."}, {"title": "أول صورة", "date": "ضع التاريخ هنا", "text": "صورة واحدة بس، وفيها ذكرى كل ما أشوفها أبتسم من غير ما أحس."}, {"title": "أول خروجة", "date": "ضع التاريخ هنا", "text": "ضحك، كلام، وتفاصيل صغيرة خلت اليوم ده يفضل مميز."}, {"title": "وما زال القادم أجمل", "date": "Always", "text": "لأن أجمل جزء في الحكاية… لسه بيتكتب."}], "reasonsTitle": "Reasons I Love You", "reasonsSubtitle": "وده مجرد جزء صغير من الأسباب", "reasons": ["لأن قلبك طيب، ووجودك بيخلّي كل حاجة أهدى.", "لأن ضحكتك من الحاجات اللي بتغيّر يوم كامل.", "لأنك جميلة في التفاصيل اللي يمكن أنتِ مش واخدة بالك منها.", "ولأنك ببساطة… أنتِ، وده سبب كفاية."], "galleryTitle": "Our Gallery", "gallerySubtitle": "أجمل لحظاتنا سوا", "gallery": [{"src": "", "caption": "الصورة المفضلة عندي 🩷"}, {"src": "", "caption": "ذكرى مستحيل أنساها"}, {"src": "", "caption": "أحلى لحظة"}], "surprisesTitle": "Little Surprises", "surprisesSubtitle": "اضغطي على أي واحدة", "surprises": [{"title": "لما تكوني زعلانة", "description": "رسالة صغيرة مخصوص علشان اليوم التقيل.", "button": "افتحي الرسالة", "modalTitle": "لما تكوني زعلانة", "modalText": "افتكري إن في حد شايفك أجمل جزء في يومه، ومهما اليوم كان صعب… ابتسامتك تستاهل ترجع تاني. 🩷", "icon": "heart"}, {"title": "لما تشتاقيلي", "description": "ودي تتفتح وقت الاشتياق بس.", "button": "افتحي الرسالة", "modalTitle": "وأنا كمان", "modalText": "لو فتحتي دي لأنك مشتاقالي… غالبًا في نفس اللحظة أنا مشتاق لك أكتر. 🩷", "icon": "heart"}, {"title": "صندوق المفاجأة", "description": "في حاجة حلوة مستخبية جواه.", "button": "افتحي الصندوق", "modalTitle": "Surprise!", "modalText": "المفاجأة الحقيقية مش مكتوبة هنا… دي هتاخديها مني بنفسك. 😉", "icon": "gift"}, {"title": "أغنيتنا", "description": "مكان خاص لأغنيتكم.", "button": "افتحي", "modalTitle": "Our Song", "modalText": "اكتب هنا اسم الأغنية أو رسالة مرتبطة بيها.", "icon": "music"}], "counterTitle": "Still Counting", "counterSubtitle": "من يوم ما بدأت الحكاية", "counterStart": "2024-01-01T00:00:00", "counterFooter": "من أول يوم لحد دلوقتي… ولسه بنعد 🩷", "letterTitle": "A Birthday Letter", "letterSubtitle": "من قلبي… لقلبك", "letterLabel": "رسالة مخصوص ليكِ", "letterBody": "حبيبتي…\n\nكل سنة وأنتِ أجمل حاجة حصلت في حياتي. وجودك مش مجرد جزء من يومي، أنتِ من الحاجات اللي خلت الأيام نفسها يبقى ليها طعم مختلف.\n\nأتمنى السنة الجديدة من عمرك تكون مليانة راحة، ضحك، نجاح، وحاجات حلوة كتير تستاهليها. وأتمنى أفضل موجود في كل لحظة فرح جاية لكِ، وأكون أول حد مبسوط علشانك.\n\nمهما كتبت، مش هعرف أوصف مكانتك عندي بالكامل… لكن أتمنى الموقع ده يفضل يذكّرك بحاجة واحدة: إنك غالية جدًا عليّ.", "letterSignature": "Forever yours ♡", "finalHeading": "This website ends here…", "finalText": "but our story doesn’t.", "finalBirthday": "Happy Birthday, My Love", "sky": "#78c8ff", "pink": "#ff92b9"};</script>

<div id="intro"><div class="introbox"><div class="heartMain emoji">🩷</div><h2 id="introT"></h2><p id="introS"></p></div></div>
<div id="lock"><div class="lockbox"><div class="heartMain">♡</div><h2 id="lockT"></h2><p id="lockX"></p><input id="pw" class="lockinput" type="text"><button id="lockB" class="lockbtn"></button><div id="lockHint" class="hint"></div><div id="lockErr" class="err"></div></div></div>

<div class="app">
<section class="hero"><div class="glass"><div class="badge">♡ <span id="badge"></span></div><h1 id="heroTitle"></h1><p id="heroText"></p><button id="heroButton" class="cta"></button><div id="heroNote" class="note"></div></div></section>
<div class="sep"></div>
<section><div class="head"><h2 id="storyTitle"></h2><p id="storySubtitle"></p></div><div id="story" class="timeline"></div></section>
<div class="sep"></div>
<section><div class="head"><h2 id="reasonsTitle"></h2><p id="reasonsSubtitle"></p></div><div id="reasons" class="grid2"></div></section>
<div class="sep"></div>
<section><div class="head"><h2 id="galleryTitle"></h2><p id="gallerySubtitle"></p></div><div id="gallery" class="gallery"></div></section>
<div class="sep"></div>
<section><div class="head"><h2 id="surprisesTitle"></h2><p id="surprisesSubtitle"></p></div><div id="surprises" class="grid2"></div></section>
<div class="sep"></div>
<section><div class="head"><h2 id="counterTitle"></h2><p id="counterSubtitle"></p></div><div class="card"><div class="counter"><div class="c"><strong id="d">0</strong><small>يوم</small></div><div class="c"><strong id="h">00</strong><small>ساعة</small></div><div class="c"><strong id="m">00</strong><small>دقيقة</small></div><div class="c"><strong id="s">00</strong><small>ثانية</small></div></div><p id="counterFooter" style="text-align:center;margin-top:14px"></p></div></section>
<div class="sep"></div>
<section><div class="head"><h2 id="letterTitle"></h2><p id="letterSubtitle"></p></div><div class="card"><b id="letterLabel"></b><p id="letterBody" class="letter"></p><div id="letterSignature" class="sign"></div></div></section>
<section class="final"><div class="card"><div class="finalHeart emoji">🩷</div><h2 id="finalHeading" style="font-family:'Segoe Script','Brush Script MT',cursive;color:#4d7da7"></h2><p id="finalText"></p><p><b id="finalBirthday" style="color:#4c7da8"></b></p></div></section>
</div>

<div id="modal" class="modal"><div class="sheet"><h3 id="modalTitle"></h3><p id="modalText"></p><button class="close" onclick="modal.classList.remove('show')">إغلاق</button></div></div>

<script>
const $=id=>document.getElementById(id);
document.title=SITE_DATA.pageTitle||"For My Love";
document.documentElement.style.setProperty("--sky",SITE_DATA.sky||"#78c8ff");
document.documentElement.style.setProperty("--pink",SITE_DATA.pink||"#ff92b9");

$("introT").textContent=SITE_DATA.introTitle;$("introS").textContent=SITE_DATA.introSubtitle;
$("lockT").textContent=SITE_DATA.lockTitle;$("lockX").textContent=SITE_DATA.lockText;$("lockB").textContent=SITE_DATA.lockButton;$("lockHint").textContent=SITE_DATA.passwordHint;$("pw").placeholder=SITE_DATA.password;
$("badge").textContent=SITE_DATA.heroBadge;$("heroTitle").innerHTML=(SITE_DATA.heroTitle||"").split("\n").map(x=>x.replace(/</g,"&lt;")).join("<br>");$("heroText").textContent=SITE_DATA.heroText;$("heroButton").textContent=SITE_DATA.heroButton;$("heroNote").textContent=SITE_DATA.heroNote;
$("storyTitle").textContent=SITE_DATA.storyTitle;$("storySubtitle").textContent=SITE_DATA.storySubtitle;
$("reasonsTitle").textContent=SITE_DATA.reasonsTitle;$("reasonsSubtitle").textContent=SITE_DATA.reasonsSubtitle;
$("galleryTitle").textContent=SITE_DATA.galleryTitle;$("gallerySubtitle").textContent=SITE_DATA.gallerySubtitle;
$("surprisesTitle").textContent=SITE_DATA.surprisesTitle;$("surprisesSubtitle").textContent=SITE_DATA.surprisesSubtitle;
$("counterTitle").textContent=SITE_DATA.counterTitle;$("counterSubtitle").textContent=SITE_DATA.counterSubtitle;$("counterFooter").textContent=SITE_DATA.counterFooter;
$("letterTitle").textContent=SITE_DATA.letterTitle;$("letterSubtitle").textContent=SITE_DATA.letterSubtitle;$("letterLabel").textContent=SITE_DATA.letterLabel;$("letterBody").textContent=SITE_DATA.letterBody;$("letterSignature").textContent=SITE_DATA.letterSignature;
$("finalHeading").textContent=SITE_DATA.finalHeading;$("finalText").textContent=SITE_DATA.finalText;$("finalBirthday").textContent=SITE_DATA.finalBirthday;

const icons=["♡","◯","⌁","✦"];
$("story").innerHTML=SITE_DATA.story.map((x,i)=>`<div class="event"><div class="dot">${icons[i]||"♡"}</div><div class="event-card"><h3>${esc(x.title)}</h3><div class="date">${esc(x.date)}</div><p>${esc(x.text)}</p></div></div>`).join("");
$("reasons").innerHTML=SITE_DATA.reasons.map((x,i)=>`<div class="card reason"><div class="ri">♡</div><b>${esc(x)}</b></div>`).join("");
$("gallery").innerHTML=SITE_DATA.gallery.map((x,i)=>`<div class="polaroid ${i===0?"big":""}"><div class="photo" style="${x.src?`background-image:url('${x.src}')`:""}">${x.src?"":"♡"}</div><div class="cap">${esc(x.caption)}</div></div>`).join("");
$("surprises").innerHTML=SITE_DATA.surprises.map((x,i)=>`<div class="card surprise"><div><div class="sicon">♡</div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p></div><button class="sbtn" onclick="showSurprise(${i})">${esc(x.button)}</button></div>`).join("");
function showSurprise(i){const x=SITE_DATA.surprises[i];$("modalTitle").textContent=x.modalTitle;$("modalText").textContent=x.modalText;$("modal").classList.add("show")}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

$("lockB").onclick=()=>{if($("pw").value===String(SITE_DATA.password)){$("lock").classList.add("fade");setTimeout(()=>$("lock").style.display="none",700)}else{$("lockErr").textContent="الباسورد مش صح"}};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("lockB").click()});
$("heroButton").onclick=()=>document.querySelectorAll("section")[1].scrollIntoView({behavior:"smooth"});

let introTimer=setInterval(()=>{const e=document.createElement("div");e.className="float"+(Math.random()>.75?" blue":"");e.textContent="♥";e.style.left=(Math.random()*96)+"vw";e.style.fontSize=(12+Math.random()*22)+"px";e.style.animationDuration=(2.8+Math.random()*2.8)+"s";$("intro").appendChild(e);setTimeout(()=>e.remove(),6500)},120);
setTimeout(()=>{clearInterval(introTimer);$("intro").classList.add("fade");setTimeout(()=>$("intro").style.display="none",700)},2400);

function tick(){let n=Math.max(0,Date.now()-new Date(SITE_DATA.counterStart).getTime());let D=Math.floor(n/86400000);n%=86400000;let H=Math.floor(n/3600000);n%=3600000;let M=Math.floor(n/60000);n%=60000;let S=Math.floor(n/1000);$("d").textContent=D;$("h").textContent=String(H).padStart(2,"0");$("m").textContent=String(M).padStart(2,"0");$("s").textContent=String(S).padStart(2,"0")}
tick();setInterval(tick,1000);
</script>
</body></html>
